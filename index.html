<script>


// ==================================================
// 基本設定
// ==================================================


// Google Apps Script Web App

const API_URL =
  "https://script.google.com/macros/s/AKfycbwCtCiKz11TnuhGFdcBblkyEbrTq7AD-BDu9W0N3_oT85nj_yv1x_dBgT9HBKU3z6jXEA/exec";


// 你的 LIFF ID

const LIFF_ID =
  "2011503589-itpEsuU9";


// ==================================================
// 全域變數
// ==================================================

let currentUser = null;

let currentPosition = null;

let stores = [];

let todayRecords = [];


// ==================================================
// 頁面啟動
// ==================================================

window.onload = async function () {

  try {

    await initializeLIFF();

    await loadStores();

    getLocation();

    loadTodayRecords();

  }

  catch (error) {

    console.error(error);

    showStatus(
      "系統載入失敗，請重新整理頁面"
    );

  }

};


// ==================================================
// LIFF
// ==================================================

async function initializeLIFF() {

  await liff.init({
    liffId: LIFF_ID
  });


  if (!liff.isLoggedIn()) {

    liff.login();

    return;

  }


  const profile =
    await liff.getProfile();


  currentUser = {

    userId:
      profile.userId,

    name:
      profile.displayName,

    pictureUrl:
      profile.pictureUrl

  };


  document.getElementById(
    "userName"
  ).textContent =
    profile.displayName;


  document.getElementById(
    "avatar"
  ).src =
    profile.pictureUrl;


  document.getElementById(
    "todayDate"
  ).textContent =
    getTodayText();

}


// ==================================================
// 今天日期
// ==================================================

function getTodayText() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  return `${year}/${month}/${day}`;

}


// ==================================================
// 取得門市
// ==================================================

async function loadStores() {

  const select =
    document.getElementById(
      "storeSelect"
    );


  try {

    const response =
      await fetch(
        API_URL +
        "?action=getStores"
      );


    const data =
      await response.json();


    console.log(
      "Stores:",
      data
    );


    if (!data.success) {

      throw new Error(
        data.message ||
        "取得門市失敗"
      );

    }


    stores =
      data.stores || [];


    select.innerHTML = "";


    if (stores.length === 0) {

      select.innerHTML =
        '<option value="">目前沒有啟用的門市</option>';

      return;

    }


    const defaultOption =
      document.createElement(
        "option"
      );


    defaultOption.value = "";

    defaultOption.textContent =
      "請選擇門市";


    select.appendChild(
      defaultOption
    );


    stores.forEach(
      function (store, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          index;


        option.textContent =
          store.name;


        select.appendChild(
          option
        );

      }
    );


    select.onchange =
      updateDistance;


  }

  catch (error) {

    console.error(error);


    select.innerHTML =
      '<option value="">門市載入失敗</option>';


    showStatus(
      "無法取得門市資料"
    );

  }

}


// ==================================================
// GPS
// ==================================================

function getLocation() {

  const gpsStatus =
    document.getElementById(
      "gpsStatus"
    );


  if (!navigator.geolocation) {

    gpsStatus.textContent =
      "❌ 此裝置不支援 GPS";

    return;

  }


  gpsStatus.textContent =
    "📍 正在取得目前位置...";


  navigator.geolocation.getCurrentPosition(

    function (position) {

      currentPosition =
        position;


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      gpsStatus.innerHTML =
        "📍 GPS 已取得<br>" +
        "緯度：" +
        latitude.toFixed(6) +
        "<br>" +
        "經度：" +
        longitude.toFixed(6);


      updateDistance();

    },


    function (error) {

      console.error(error);


      gpsStatus.textContent =
        "❌ 無法取得 GPS，請確認手機定位權限";


    },

    {

      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 0

    }

  );

}


// ==================================================
// 計算距離
// ==================================================

function calculateDistance(

  lat1,
  lon1,
  lat2,
  lon2

) {


  const R =
    6371000;


  const dLat =
    toRadians(
      lat2 - lat1
    );


  const dLon =
    toRadians(
      lon2 - lon1
    );


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(
      toRadians(lat1)
    ) *

    Math.cos(
      toRadians(lat2)
    ) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


function toRadians(degrees) {

  return degrees *
    Math.PI /
    180;

}


// ==================================================
// 更新距離
// ==================================================

function updateDistance() {

  const select =
    document.getElementById(
      "storeSelect"
    );


  const distanceElement =
    document.getElementById(
      "distance"
    );


  if (
    !currentPosition ||
    select.value === ""
  ) {

    distanceElement.textContent =
      "";

    return;

  }


  const store =
    stores[
      Number(select.value)
    ];


  if (!store) {

    distanceElement.textContent =
      "";

    return;

  }


  const distance =
    calculateDistance(

      currentPosition.coords.latitude,

      currentPosition.coords.longitude,

      store.latitude,

      store.longitude

    );


  distanceElement.textContent =

    "📏 距離" +
    store.name +
    "約 " +
    Math.round(distance) +
    " 公尺";


}


// ==================================================
// 打卡
// ==================================================

async function submitAttendance(
  type
) {


  if (!currentUser) {

    showStatus(
      "尚未取得 LINE 使用者資料"
    );

    return;

  }


  const select =
    document.getElementById(
      "storeSelect"
    );


  if (select.value === "") {

    showStatus(
      "請先選擇門市"
    );

    return;

  }


  if (!currentPosition) {

    showStatus(
      "尚未取得 GPS 位置"
    );

    return;

  }


  const store =
    stores[
      Number(select.value)
    ];


  if (!store) {

    showStatus(
      "門市資料錯誤"
    );

    return;

  }


  // 防止連續點擊

  const button =
    type === "上班"

      ? document.getElementById(
          "checkinButton"
        )

      : document.getElementById(
          "checkoutButton"
        );


  button.disabled =
    true;


  showStatus(
    "正在打卡..."
  );


  const data = {

    lineUserId:
      currentUser.userId,

    name:
      currentUser.name,

    type:
      type,

    latitude:
      currentPosition.coords.latitude,

    longitude:
      currentPosition.coords.longitude,

    store:
      store.name

  };


  try {


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(data)

        }
      );


    const result =
      await response.json();


    console.log(
      "打卡結果:",
      result
    );


    if (!result.success) {

      showStatus(
        result.message
      );


      button.disabled =
        false;


      return;

    }


    showStatus(
      "✅ " +
      result.message
    );


    // 成功後重新取得今日紀錄

    await loadTodayRecords();


  }

  catch (error) {

    console.error(error);


    showStatus(
      "打卡失敗，請稍後再試"
    );


    button.disabled =
      false;

  }

}


// ==================================================
// 今日紀錄
// ==================================================

async function loadTodayRecords() {

  const container =
    document.getElementById(
      "todayRecords"
    );


  container.innerHTML =
    '<div class="loading">載入今日紀錄中...</div>';


  // ------------------------------------------------
  // 目前 Apps Script 還沒有提供查詢紀錄 API
  // ------------------------------------------------
  //
  // 所以這裡先顯示提示。
  //
  // 下一步加入 getTodayRecords()
  // 後，這裡就會真正顯示資料。
  // ------------------------------------------------


  container.innerHTML =

    '<div class="empty">' +
    '今日紀錄功能即將完成' +
    '</div>';


  updateButtonStatus();

}


// ==================================================
// 更新按鈕狀態
// ==================================================

function updateButtonStatus() {

  // 下一階段接 Google Sheet
  // 查詢今天是否已經上班／下班

}


// ==================================================
// 顯示訊息
// ==================================================

function showStatus(
  message
) {

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;

}


</script>

     LIFF SDK
================================================== -->

<script
  src="https://static.line-scdn.net/liff/edge/2/sdk.js"
></script>


</body>

</html>
