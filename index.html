<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>員工打卡</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      background: #f5f6f8;

      color: #222;

    }


    .container {

      max-width: 480px;

      margin: 0 auto;

    }


    .card {

      background: white;

      border-radius: 18px;

      padding: 22px;

      margin-bottom: 16px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.06);

    }


    .header {

      text-align: center;

      padding-top: 10px;

    }


    .avatar {

      width: 70px;

      height: 70px;

      border-radius: 50%;

      object-fit: cover;

      margin-bottom: 10px;

      background: #eee;

    }


    .name {

      font-size: 21px;

      font-weight: 700;

      margin-bottom: 6px;

    }


    .date {

      color: #777;

      font-size: 14px;

    }


    .section-title {

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 14px;

    }


    label {

      display: block;

      font-size: 14px;

      color: #666;

      margin-bottom: 7px;

    }


    select {

      width: 100%;

      padding: 13px;

      font-size: 16px;

      border: 1px solid #ddd;

      border-radius: 10px;

      background: white;

      outline: none;

    }


    select:focus {

      border-color: #333;

    }


    .gps {

      margin-top: 12px;

      padding: 12px;

      background: #f7f7f7;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.6;

    }


    .distance {

      margin-top: 8px;

      font-weight: 600;

    }


    .button-group {

      display: flex;

      gap: 10px;

      margin-top: 18px;

    }


    button {

      flex: 1;

      border: none;

      border-radius: 12px;

      padding: 14px 10px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    .checkin {

      background: #222;

      color: white;

    }


    .checkout {

      background: #e9e9e9;

      color: #222;

    }


    button:disabled {

      background: #ddd;

      color: #999;

      cursor: not-allowed;

    }


    .status {

      margin-top: 12px;

      text-align: center;

      font-size: 14px;

      min-height: 22px;

    }


    /* 今日紀錄 */

    .record {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 14px 0;

      border-bottom: 1px solid #eee;

    }


    .record:last-child {

      border-bottom: none;

    }


    .record-type {

      font-weight: 700;

      margin-bottom: 4px;

    }


    .record-info {

      color: #777;

      font-size: 13px;

      line-height: 1.6;

    }


    .record-time {

      font-size: 14px;

      font-weight: 600;

      color: #555;

      white-space: nowrap;

    }


    .empty {

      text-align: center;

      color: #999;

      padding: 20px 0;

      font-size: 14px;

    }


    .loading {

      text-align: center;

      color: #777;

      padding: 15px;

      font-size: 14px;

    }


  </style>

</head>


<body>


  <div class="container">


    <!-- ==================================================
         個人資訊
    ================================================== -->

    <div class="card header">

      <img
        id="avatar"
        class="avatar"
        src=""
        alt="頭像"
      >

      <div
        id="userName"
        class="name"
      >
        載入中...
      </div>

      <div
        id="todayDate"
        class="date"
      >
        載入中...
      </div>

    </div>



    <!-- ==================================================
         打卡區域
    ================================================== -->

    <div class="card">

      <div class="section-title">
        今日打卡
      </div>


      <!-- 門市 -->

      <label for="storeSelect">
        選擇門市
      </label>


      <select id="storeSelect">

        <option value="">
          載入門市中...
        </option>

      </select>


      <!-- GPS -->

      <div class="gps">

        <div id="gpsStatus">
          📍 正在取得目前位置...
        </div>

        <div
          id="distance"
          class="distance"
        ></div>

      </div>


      <!-- 打卡按鈕 -->

      <div class="button-group">

        <button
          id="checkinButton"
          class="checkin"
          onclick="submitAttendance('上班')"
        >
          上班打卡
        </button>


        <button
          id="checkoutButton"
          class="checkout"
          onclick="submitAttendance('下班')"
        >
          下班打卡
        </button>

      </div>


      <!-- 系統訊息 -->

      <div
        id="status"
        class="status"
      ></div>

    </div>



    <!-- ==================================================
         今日紀錄
    ================================================== -->

    <div class="card">

      <div class="section-title">
        今日紀錄
      </div>


      <div id="todayRecords">

        <div class="loading">
          載入中...
        </div>

      </div>

    </div>


  </div>



<script>


// ==================================================
// 基本設定
// ==================================================


// Google Apps Script Web App

const API_URL =
  "https://script.google.com/macros/s/AKfycbwCtCiKz11TnuhGFdcBblkyEbrTq7AD-BDu9W0N3_oT85nj_yv1x_dBgT9HBKU3z6jXEA/exec";


// LIFF ID

const LIFF_ID =
  "2011503589-itpEsuU9";


// ==================================================
// 全域變數
// ==================================================

let currentUser = null;

let currentPosition = null;

let stores = [];

let todayRecords = [];


// ==================================================
// 頁面啟動
// ==================================================

window.onload = async function () {

  try {

    // 1. 初始化 LINE

    await initializeLIFF();


    // 如果尚未登入
    // initializeLIFF 會處理登入

    if (!currentUser) {
      return;
    }


    // 2. 取得門市

    await loadStores();


    // 3. 取得 GPS

    getLocation();


    // 4. 取得今日紀錄

    await loadTodayRecords();

  }

  catch (error) {

    console.error(
      "系統啟動錯誤:",
      error
    );

    showStatus(
      "系統載入失敗，請重新整理頁面"
    );

  }

};


// ==================================================
// LIFF
// ==================================================

async function initializeLIFF() {

  await liff.init({
    liffId: LIFF_ID
  });


  // 尚未登入

  if (!liff.isLoggedIn()) {

    liff.login();

    return;

  }


  // 取得 LINE 個人資料

  const profile =
    await liff.getProfile();


  currentUser = {

    userId:
      profile.userId,

    name:
      profile.displayName,

    pictureUrl:
      profile.pictureUrl

  };


  // 顯示姓名

  document.getElementById(
    "userName"
  ).textContent =
    profile.displayName;


  // 顯示頭像

  document.getElementById(
    "avatar"
  ).src =
    profile.pictureUrl;


  // 顯示日期

  document.getElementById(
    "todayDate"
  ).textContent =
    getTodayText();

}


// ==================================================
// 今天日期
// ==================================================

function getTodayText() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  return `${year}/${month}/${day}`;

}


// ==================================================
// 取得門市
// ==================================================

async function loadStores() {

  const select =
    document.getElementById(
      "storeSelect"
    );


  try {

    const response =
      await fetch(
        API_URL +
        "?action=getStores"
      );


    const data =
      await response.json();


    console.log(
      "Stores:",
      data
    );


    if (!data.success) {

      throw new Error(
        data.message ||
        "取得門市失敗"
      );

    }


    stores =
      data.stores || [];


    select.innerHTML = "";


    // 沒有門市

    if (stores.length === 0) {

      select.innerHTML =
        '<option value="">目前沒有啟用的門市</option>';

      return;

    }


    // 預設選項

    const defaultOption =
      document.createElement(
        "option"
      );


    defaultOption.value = "";

    defaultOption.textContent =
      "請選擇門市";


    select.appendChild(
      defaultOption
    );


    // 加入所有門市

    stores.forEach(
      function(store, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          index;


        option.textContent =
          store.name;


        select.appendChild(
          option
        );

      }
    );


    // 選擇門市時重新計算距離

    select.onchange =
      updateDistance;


  }

  catch (error) {

    console.error(
      "取得門市錯誤:",
      error
    );


    select.innerHTML =
      '<option value="">門市載入失敗</option>';


    showStatus(
      "無法取得門市資料"
    );

  }

}


// ==================================================
// GPS
// ==================================================

function getLocation() {

  const gpsStatus =
    document.getElementById(
      "gpsStatus"
    );


  if (!navigator.geolocation) {

    gpsStatus.textContent =
      "❌ 此裝置不支援 GPS";

    return;

  }


  gpsStatus.textContent =
    "📍 正在取得目前位置...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      currentPosition =
        position;


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      console.log(
        "GPS:",
        latitude,
        longitude
      );


      gpsStatus.innerHTML =
        "📍 GPS 已取得<br>" +
        "緯度：" +
        latitude.toFixed(6) +
        "<br>" +
        "經度：" +
        longitude.toFixed(6);


      // 更新距離

      updateDistance();

    },


    function(error) {

      console.error(
        "GPS 錯誤:",
        error
      );


      gpsStatus.textContent =
        "❌ 無法取得 GPS，請確認手機定位權限";

    },


    {

      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 0

    }

  );

}


// ==================================================
// 計算距離
// ==================================================

function calculateDistance(

  lat1,
  lon1,
  lat2,
  lon2

) {

  const R =
    6371000;


  const dLat =
    toRadians(
      lat2 - lat1
    );


  const dLon =
    toRadians(
      lon2 - lon1
    );


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(
      toRadians(lat1)
    )

    *

    Math.cos(
      toRadians(lat2)
    )

    *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


// ==================================================
// 度數轉弧度
// ==================================================

function toRadians(degrees) {

  return degrees *
    Math.PI /
    180;

}


// ==================================================
// 更新距離
// ==================================================

function updateDistance() {

  const select =
    document.getElementById(
      "storeSelect"
    );


  const gpsStatus =
    document.getElementById(
      "gpsStatus"
    );


  const distanceElement =
    document.getElementById(
      "distance"
    );


  // 尚未取得 GPS 或尚未選門市

  if (
    !currentPosition ||
    select.value === ""
  ) {

    distanceElement.textContent =
      "";

    return;

  }


  const store =
    stores[
      Number(select.value)
    ];


  if (!store) {

    distanceElement.textContent =
      "";

    return;

  }


  // 計算距離

  const distance =
    calculateDistance(

      currentPosition.coords.latitude,

      currentPosition.coords.longitude,

      store.latitude,

      store.longitude

    );


  const allowedDistance =
    store.allowedDistance || 100;


  // 顯示 GPS 狀態

  if (
    distance <= allowedDistance
  ) {

    gpsStatus.textContent =
      "📍 已在門市範圍內";

  }

  else {

    gpsStatus.textContent =
      "⚠️ 不在門市範圍內";

  }


  // 顯示距離

  distanceElement.textContent =
    "距離門市約 " +
    Math.round(distance) +
    " 公尺";

}


// ==================================================
// 打卡
// ==================================================

async function submitAttendance(type) {

  // 確認 LINE 使用者

  if (!currentUser) {

    showStatus(
      "尚未取得 LINE 使用者資料"
    );

    return;

  }


  // 取得門市

  const select =
    document.getElementById(
      "storeSelect"
    );


  if (select.value === "") {

    showStatus(
      "請先選擇門市"
    );

    return;

  }


  // 確認 GPS

  if (!currentPosition) {

    showStatus(
      "尚未取得 GPS 位置"
    );

    return;

  }


  // 取得門市資料

  const store =
    stores[
      Number(select.value)
    ];


  if (!store) {

    showStatus(
      "門市資料錯誤"
    );

    return;

  }


  // ==================================================
  // 防止連續點擊
  // ==================================================

  const button =
    type === "上班"
      ? document.getElementById(
          "checkinButton"
        )
      : document.getElementById(
          "checkoutButton"
        );


  button.disabled = true;


  showStatus(
    "正在打卡..."
  );


  try {

    // ==================================================
    // 使用 GET 傳送
    // ==================================================

    const params =
      new URLSearchParams();


    params.append(
      "action",
      "submitAttendance"
    );


    params.append(
      "lineUserId",
      currentUser.userId
    );


    params.append(
      "name",
      currentUser.name
    );


    params.append(
      "type",
      type
    );


    params.append(
      "store",
      store.name
    );


    params.append(
      "latitude",
      currentPosition.coords.latitude
    );


    params.append(
      "longitude",
      currentPosition.coords.longitude
    );


    // ==================================================
    // 呼叫 Google Apps Script
    // ==================================================

    const response =
      await fetch(
        API_URL +
        "?" +
        params.toString()
      );


    const result =
      await response.json();


    console.log(
      "打卡結果:",
      result
    );


    // ==================================================
    // 打卡失敗
    // ==================================================

    if (!result.success) {

      showStatus(
        result.message
      );


      button.disabled =
        false;


      return;

    }


    // ==================================================
    // 打卡成功
    // ==================================================

    showStatus(
      "✅ " +
      result.message
    );


    // 重新取得今日紀錄

    await loadTodayRecords();

  }


  catch (error) {

    console.error(
      "打卡錯誤:",
      error
    );


    showStatus(
      "打卡失敗，請稍後再試"
    );


    button.disabled =
      false;

  }

}


// ==================================================
// 取得今日紀錄
// ==================================================

async function loadTodayRecords() {

  const container =
    document.getElementById(
      "todayRecords"
    );


  container.innerHTML =
    '<div class="loading">載入今日紀錄中...</div>';


  // 確認使用者

  if (!currentUser) {

    container.innerHTML =
      '<div class="empty">尚未取得使用者資料</div>';

    return;

  }


  try {

    // ==================================================
    // 建立查詢參數
    // ==================================================

    const params =
      new URLSearchParams();


    params.append(
      "action",
      "getTodayRecords"
    );


    params.append(
      "lineUserId",
      currentUser.userId
    );


    // ==================================================
    // 呼叫 API
    // ==================================================

    const response =
      await fetch(
        API_URL +
        "?" +
        params.toString()
      );


    const result =
      await response.json();


    console.log(
      "今日紀錄:",
      result
    );


    // ==================================================
    // 查詢失敗
    // ==================================================

    if (!result.success) {

      container.innerHTML =
        '<div class="empty">' +
        result.message +
        '</div>';

      return;

    }


    // ==================================================
    // 取得紀錄
    // ==================================================

    const records =
      result.records || [];


    todayRecords =
      records;


    // ==================================================
    // 沒有紀錄
    // ==================================================

    if (records.length === 0) {

      container.innerHTML =
        '<div class="empty">' +
        '今天尚未打卡' +
        '</div>';


      updateButtonStatus(
        records
      );


      return;

    }


    // ==================================================
    // 清空原本內容
    // ==================================================

    container.innerHTML =
      "";


    // ==================================================
    // 顯示每一筆紀錄
    // ==================================================

    records.forEach(
      function(record) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "record";


        item.innerHTML =

          '<div>' +

            '<div class="record-type">' +
              escapeHtml(
                record.type
              ) +
            '</div>' +

            '<div class="record-info">' +
              escapeHtml(
                record.store
              ) +
            '</div>' +

          '</div>' +

          '<div class="record-time">' +
            escapeHtml(
              record.time
            ) +
          '</div>';


        container.appendChild(
          item
        );

      }
    );


    // ==================================================
    // 更新按鈕狀態
    // ==================================================

    updateButtonStatus(
      records
    );

  }


  catch (error) {

    console.error(
      "取得今日紀錄失敗:",
      error
    );


    container.innerHTML =
      '<div class="empty">' +
      '今日紀錄載入失敗' +
      '</div>';

  }

}


// ==================================================
// 更新按鈕狀態
// ==================================================

function updateButtonStatus(records) {

  const checkinButton =
    document.getElementById(
      "checkinButton"
    );


  const checkoutButton =
    document.getElementById(
      "checkoutButton"
    );


  if (
    !checkinButton ||
    !checkoutButton
  ) {

    return;

  }


  records =
    records || [];


  let hasCheckin =
    false;


  let hasCheckout =
    false;


  // ==================================================
  // 判斷今天是否已經打卡
  // ==================================================

  records.forEach(
    function(record) {

      if (
        record.type === "上班"
      ) {

        hasCheckin =
          true;

      }


      if (
        record.type === "下班"
      ) {

        hasCheckout =
          true;

      }

    }
  );


  // ==================================================
  // 上班按鈕
  // ==================================================

  if (hasCheckin) {

    checkinButton.disabled =
      true;


    checkinButton.textContent =
      "✓ 已完成上班打卡";

  }

  else {

    checkinButton.disabled =
      false;


    checkinButton.textContent =
      "上班打卡";

  }


  // ==================================================
  // 下班按鈕
  // ==================================================

  if (hasCheckout) {

    checkoutButton.disabled =
      true;


    checkoutButton.textContent =
      "✓ 已完成下班打卡";

  }

  else {

    checkoutButton.disabled =
      false;


    checkoutButton.textContent =
      "下班打卡";

  }

}


// ==================================================
// HTML 安全處理
// ==================================================

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==================================================
// 顯示訊息
// ==================================================

function showStatus(message) {

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;

}


</script>

     LIFF SDK
================================================== -->

<script
  src="https://static.line-scdn.net/liff/edge/2/sdk.js"
></script>


</body>

</html>
